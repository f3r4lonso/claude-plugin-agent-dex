[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-dex"
version = "0.1.0b1"
description = "Collect, create and run AI agents and skills from a local web app. Claude Code plugin backend."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "f3r4lonso" }]
keywords = ["claude-code", "agents", "skills", "plugin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "websockets>=13",
  "pyyaml>=6,<7",
  "claude-agent-sdk>=0.2.174,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
agent-dex = "agent_dex.cli:main"

[project.urls]
Homepage = "https://github.com/f3r4lonso/claude-plugin-agent-dex"
Issues = "https://github.com/f3r4lonso/claude-plugin-agent-dex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_dex"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_dex", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
